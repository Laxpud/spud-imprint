[package]
name = "spud-imprint-gui"
version = "0.1.0"
description = "Desktop prototype for Spud Imprint"
authors = ["Spud Imprint contributors"]
edition = "2021"
license = "MIT"
build = "build.rs"

[lib]
name = "spud_imprint_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
